openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PropFlow property management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Owner authentication and profile
  - name: properties
    description: Property management
  - name: flats
    description: Units and tenant assignments
  - name: payments
    description: Rent payment records
  - name: dashboard
    description: Dashboard summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check whether an owner account exists yet
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /auth/setup:
    post:
      operationId: setupOwner
      tags: [auth]
      summary: Create the first (and only) owner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupBody"
      responses:
        "201":
          description: Owner created and logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in as the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the current owner's profile
      responses:
        "200":
          description: Owner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the current owner's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerUpdate"
      responses:
        "200":
          description: Updated owner profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
  /auth/change-pin:
    post:
      operationId: changePin
      tags: [auth]
      summary: Change the owner's PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePinInput"
      responses:
        "204":
          description: PIN changed
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List properties
      responses:
        "200":
          description: Properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
  /properties/{id}:
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /flats:
    get:
      operationId: listFlats
      tags: [flats]
      summary: List flats with payment totals
      parameters:
        - in: query
          name: propertyId
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Flats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flat"
    post:
      operationId: createFlat
      tags: [flats]
      summary: Create a unit, optionally assigning a tenant to it immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlatInput"
      responses:
        "201":
          description: Created flat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flat"
  /flats/{id}:
    patch:
      operationId: updateFlat
      tags: [flats]
      summary: Update a flat
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlatUpdate"
      responses:
        "200":
          description: Updated flat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flat"
    delete:
      operationId: deleteFlat
      tags: [flats]
      summary: Delete a flat
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /flats/{id}/renew:
    post:
      operationId: renewFlat
      tags: [flats]
      summary: Renew an expired (or expiring) tenure with a new end date and rent
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewFlatInput"
      responses:
        "200":
          description: Renewed flat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flat"
  /flats/{id}/vacate:
    post:
      operationId: vacateFlat
      tags: [flats]
      summary: Vacate a unit - clears the tenant assignment but keeps the unit itself
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Vacated flat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flat"
  /flats/{id}/payments:
    get:
      operationId: listFlatPayments
      tags: [payments]
      summary: List payment history for a flat
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a payment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Property:
      type: object
      required: [id, createdAt, name, address, unitCount]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        address: { type: string }
        unitCount: { type: number }
    PropertyInput:
      type: object
      required: [name, address]
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        unitNumbers:
          type: array
          items: { type: string, minLength: 1 }
          description: "Unit numbers to create for this property up front. Tenants are assigned to these units later."
    PropertyUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
    Flat:
      type: object
      required: [id, createdAt, propertyId, propertyName, flatNo, tenantName, workplace, govtId, moveInDate, tenureEnd, isExpired, isOccupied, deposit, rent, totalPaid, lastPaymentDate]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        propertyId: { type: string }
        propertyName: { type: string }
        flatNo: { type: string }
        tenantName: { type: ["string", "null"] }
        workplace: { type: ["string", "null"] }
        govtId: { type: ["string", "null"] }
        moveInDate: { type: ["string", "null"], format: date }
        tenureEnd: { type: ["string", "null"], format: date }
        isExpired: { type: boolean, description: "True when tenureEnd is in the past" }
        isOccupied: { type: boolean, description: "True when a tenant is currently assigned to this unit" }
        deposit: { type: ["number", "null"] }
        rent: { type: ["number", "null"] }
        totalPaid: { type: number }
        lastPaymentDate: { type: ["string", "null"], format: date }
    FlatInput:
      type: object
      required: [propertyId, flatNo]
      description: "Creates a unit. Tenant fields are optional here - a unit is usually created empty and a tenant assigned to it later."
      properties:
        propertyId: { type: string }
        flatNo: { type: string, minLength: 1 }
        tenantName: { type: string, minLength: 1 }
        workplace: { type: string }
        govtId: { type: string }
        moveInDate: { type: string, format: date }
        tenureEnd: { type: string, format: date }
        deposit: { type: number, minimum: 0 }
        rent: { type: number, minimum: 0 }
    FlatUpdate:
      type: object
      properties:
        flatNo: { type: string, minLength: 1 }
        tenantName: { type: string, minLength: 1 }
        workplace: { type: string }
        govtId: { type: string }
        moveInDate: { type: string, format: date }
        tenureEnd: { type: string, format: date }
        deposit: { type: number, minimum: 0 }
        rent: { type: number, minimum: 0 }
    RenewFlatInput:
      type: object
      required: [tenureEnd, rent]
      properties:
        tenureEnd: { type: string, format: date }
        rent: { type: number, minimum: 0 }
    Payment:
      type: object
      required: [id, createdAt, flatId, paymentDate, amount]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        flatId: { type: string }
        paymentDate: { type: string, format: date }
        amount: { type: number, minimum: 0 }
    PaymentInput:
      type: object
      required: [paymentDate, amount]
      properties:
        paymentDate: { type: string, format: date }
        amount: { type: number, minimum: 0 }
    DashboardSummary:
      type: object
      required: [expectedMonthlyRevenue, totalCollected, occupiedUnits, totalUnits, propertiesCount, dueForRevision]
      properties:
        expectedMonthlyRevenue: { type: number }
        totalCollected: { type: number }
        occupiedUnits: { type: number }
        totalUnits: { type: number }
        propertiesCount: { type: number }
        dueForRevision: { type: number }
    Activity:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [payment, property, tenant, revision] }
        title: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    AuthStatus:
      type: object
      required: [hasOwner]
      properties:
        hasOwner: { type: boolean }
    Owner:
      type: object
      required: [id, createdAt, name, phone]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        name: { type: string }
        phone: { type: ["string", "null"] }
    SetupBody:
      type: object
      required: [pin, name]
      properties:
        pin: { type: string, pattern: "^[0-9]{4}$", description: "4-digit PIN" }
        name: { type: string, minLength: 1 }
    LoginCredentials:
      type: object
      required: [pin]
      properties:
        pin: { type: string, pattern: "^[0-9]{4}$", description: "4-digit PIN" }
    OwnerUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string }
    ChangePinInput:
      type: object
      required: [currentPin, newPin]
      properties:
        currentPin: { type: string, pattern: "^[0-9]{4}$" }
        newPin: { type: string, pattern: "^[0-9]{4}$" }